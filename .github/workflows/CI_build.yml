name: CI_build

on: [push, pull_request]

jobs:
  web:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Install preview page dependencies
      run: npm ci

    - name: Web tests (renderer, sanitizer XSS corpus, scroll sync)
      run: npm test

    - name: Build preview page
      run: npm run build

  build:

    # arm64 runs on a native Windows 11 Arm64 runner so its tests can execute.
    runs-on: ${{ matrix.build_platform == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    env:
      # Not "ProjectName": MSBuild reads env vars as properties (case-insensitively), and that one
      # would rename every project's output, so NativeTests.exe became MarkdownReader.exe.
      PLUGIN_NAME: MarkdownReader
    strategy:
      fail-fast: false
      matrix:
        build_platform: [x64, Win32, arm64]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: MSBuild for nuget package restore
      working-directory: .\
      run: |
           msbuild ${{ env.PLUGIN_NAME }}.sln -t:restore -p:RestorePackagesConfig=true

    - name: MSBuild of plugin dll Debug
      working-directory: .\
      run: |
           msbuild ${{ env.PLUGIN_NAME }}.sln  /p:configuration=Debug /p:platform="${{ matrix.build_platform }}"

    - name: MSBuild of plugin dll Release
      working-directory: .\
      run: |
           msbuild ${{ env.PLUGIN_NAME }}.sln  /p:configuration=Release /p:platform="${{ matrix.build_platform }}"

    - name: Native tests Release
      working-directory: .\
      run: |
           .\build\Release\${{ matrix.build_platform }}\NativeTests.exe

    - uses: olegtarasov/get-tag@v2.1.4
      id: tagName

    - name: zip artifacts for Release ${{ matrix.build_platform }}
      run: |
           7z a ${{ env.PLUGIN_NAME }}_${{ steps.tagName.outputs.tag }}_${{ matrix.build_platform }}.zip .\build\Release\${{ matrix.build_platform }}\${{ env.PLUGIN_NAME }}.dll

    - name: Archive artifacts for Release ${{ matrix.build_platform }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.PLUGIN_NAME }}_${{ steps.tagName.outputs.tag }}_${{ matrix.build_platform }}.zip
        path: ${{ env.PLUGIN_NAME }}_${{ steps.tagName.outputs.tag }}_${{ matrix.build_platform }}.zip

    # No release step: these zips hold only the DLL. Release zips (DLL + web\ + notices) come from
    # scripts\package.ps1, and Plugins Admin pins their SHA-256s.